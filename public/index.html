<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #4f8ef7;
      --accent-dim: #1e3a6e;
      --user-bg: #1e2a3a;
      --assistant-bg: #1a1a1a;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    #new-chat-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #new-chat-btn:hover { color: var(--text); border-color: #444; }

    /* ── messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }
    .message {
      max-width: 740px;
      margin: 0 auto 20px;
      padding: 0 20px;
    }
    .message-bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user .message-bubble {
      background: var(--user-bg);
      border: 1px solid #263447;
      margin-left: 60px;
    }
    .message.assistant .message-bubble {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
    }

    /* ── inline markdown-ish rendering ── */
    .message-bubble a { color: var(--accent); text-decoration: none; }
    .message-bubble a:hover { text-decoration: underline; }
    .message-bubble code {
      background: #252525;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "SF Mono", "Consolas", monospace;
    }
    .message-bubble pre {
      background: #252525;
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .message-bubble pre code {
      background: none;
      padding: 0;
    }
    .message-bubble strong { font-weight: 600; }
    .message-bubble em { font-style: italic; }

    /* ── sources ── */
    .sources {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .source-chip {
      background: #1f1f1f;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .source-chip:hover { color: var(--accent); }

    /* ── search status ── */
    .search-status {
      max-width: 740px;
      margin: 0 auto 10px;
      padding: 0 20px;
    }
    .search-disclosure {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-disclosure:hover { color: var(--text); }
    .search-queries {
      display: none;
      margin-top: 6px;
      padding: 8px 12px;
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .search-queries.open { display: block; }
    .search-queries li { list-style: none; padding: 2px 0; }
    .search-queries li::before { content: "→ "; color: #555; }

    /* ── status line (live) ── */
    #status-line {
      max-width: 740px;
      margin: 0 auto 8px;
      padding: 0 20px;
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
      transition: opacity 0.3s;
    }

    /* ── cursor ── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 0.8s step-end infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }

    /* ── input area ── */
    #input-area {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      flex-shrink: 0;
    }
    #input-wrap {
      max-width: 740px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 160px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    #input:focus { border-color: #3a5a8a; }
    #input::placeholder { color: #555; }
    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:hover { background: #3d7ee8; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── empty state ── */
    #empty-state {
      max-width: 500px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
      color: var(--muted);
    }
    #empty-state h2 { font-size: 20px; font-weight: 500; margin-bottom: 10px; color: var(--text); }
    #empty-state p { font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1>Search Agent</h1>
  <button id="new-chat-btn">New chat</button>
</header>

<div id="messages">
  <div id="empty-state">
    <h2>What would you like to know?</h2>
    <p>Ask anything. I'll search the web for current information and remember our past conversations.</p>
  </div>
</div>

<div id="status-line"></div>

<div id="input-area">
  <div id="input-wrap">
    <textarea
      id="input"
      rows="1"
      placeholder="Ask a question…"
      autocomplete="off"
      spellcheck="true"
    ></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
(function () {
  // ── state ──────────────────────────────────────────────────────────────────
  let threadId = crypto.randomUUID();
  let isStreaming = false;
  let currentBubble = null;
  let currentSearchQueries = [];

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const statusLine = document.getElementById('status-line');
  const emptyState = document.getElementById('empty-state');

  // ── auto-resize textarea ───────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // ── send on Enter (Shift+Enter = newline) ──────────────────────────────────
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);

  document.getElementById('new-chat-btn').addEventListener('click', () => {
    threadId = crypto.randomUUID();
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    statusLine.textContent = '';
    isStreaming = false;
    currentBubble = null;
    currentSearchQueries = [];
    setDisabled(false);
  });

  // ── send ───────────────────────────────────────────────────────────────────
  function send() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    if (emptyState.parentNode) emptyState.remove();

    appendMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    setDisabled(true);
    isStreaming = true;
    currentSearchQueries = [];

    // Create the assistant bubble immediately so tokens stream into it
    currentBubble = appendMessage('assistant', '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    currentBubble.querySelector('.message-bubble').appendChild(cursor);

    // Send request
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        threadId,
        message: text,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        clientNow: new Date().toISOString(),
      }),
    }).then((response) => {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      function read() {
        reader.read().then(({ done, value }) => {
          if (done) {
            finishStream();
            return;
          }
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop(); // keep incomplete chunk

          for (const part of parts) {
            const lines = part.split('\n');
            let event = 'message';
            let data = '';
            for (const line of lines) {
              if (line.startsWith('event: ')) event = line.slice(7);
              if (line.startsWith('data: ')) data = line.slice(6);
            }
            if (data) handleEvent(event, data);
          }
          read();
        }).catch(finishStream);
      }
      read();
    }).catch((err) => {
      appendError('Could not reach the server: ' + err.message);
      finishStream();
    });
  }

  // ── SSE event handler ──────────────────────────────────────────────────────
  function handleEvent(event, rawData) {
    let data;
    try { data = JSON.parse(rawData); } catch { return; }

    switch (event) {
      case 'token':
        appendToken(data.text);
        break;
      case 'status':
        statusLine.textContent = data.text;
        break;
      case 'searching':
        if (Array.isArray(data.queries)) {
          currentSearchQueries.push(...data.queries);
        }
        break;
      case 'done':
        finishStream(data);
        break;
      case 'error':
        appendError(data.text);
        finishStream();
        break;
    }
  }

  // ── streaming helpers ──────────────────────────────────────────────────────
  let accumulatedText = '';

  function appendToken(text) {
    if (!currentBubble) return;
    accumulatedText += text;
    const bubble = currentBubble.querySelector('.message-bubble');
    // Remove cursor before re-rendering
    const cursor = bubble.querySelector('.cursor');
    if (cursor) cursor.remove();
    bubble.innerHTML = renderMarkdown(accumulatedText);
    // Re-add cursor
    const c = document.createElement('span');
    c.className = 'cursor';
    bubble.appendChild(c);
    scrollToBottom();
  }

  function finishStream(meta) {
    isStreaming = false;
    accumulatedText = '';
    setDisabled(false);
    statusLine.textContent = '';

    if (currentBubble) {
      const bubble = currentBubble.querySelector('.message-bubble');
      const cursor = bubble.querySelector('.cursor');
      if (cursor) cursor.remove();
    }

    // Add search disclosure above the bubble
    if (currentSearchQueries.length > 0) {
      const disclosure = buildSearchDisclosure(currentSearchQueries);
      const msgEl = currentBubble;
      msgEl.parentNode.insertBefore(disclosure, msgEl);
    }

    if (meta && meta.totalMs) {
      console.log(`[ui] turn complete in ${meta.totalMs}ms, searches: ${meta.searches?.length ?? 0}`);
    }

    currentBubble = null;
    currentSearchQueries = [];
    scrollToBottom();
    inputEl.focus();
  }

  // ── message rendering ──────────────────────────────────────────────────────
  function appendMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `message ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.innerHTML = text ? renderMarkdown(text) : '';
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function appendError(text) {
    const wrap = document.createElement('div');
    wrap.className = 'message assistant';
    wrap.innerHTML = `<div class="message-bubble" style="color:#e06c6c">${escapeHtml(text)}</div>`;
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  function buildSearchDisclosure(queries) {
    const wrap = document.createElement('div');
    wrap.className = 'search-status';
    const toggle = document.createElement('div');
    toggle.className = 'search-disclosure';
    toggle.innerHTML = `<span>🔍</span><span>Searched ${queries.length} quer${queries.length === 1 ? 'y' : 'ies'}</span><span style="color:#555">▾</span>`;
    const list = document.createElement('ul');
    list.className = 'search-queries';
    queries.forEach(q => {
      const li = document.createElement('li');
      li.textContent = q;
      list.appendChild(li);
    });
    toggle.addEventListener('click', () => list.classList.toggle('open'));
    wrap.appendChild(toggle);
    wrap.appendChild(list);
    return wrap;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setDisabled(v) {
    sendBtn.disabled = v;
    inputEl.disabled = v;
  }

  // ── minimal markdown renderer ──────────────────────────────────────────────
  // Handles: **bold**, *italic*, `code`, ```blocks```, [text](url), numbered
  // source links, and line breaks. No dependency needed.
  function renderMarkdown(text) {
    // Escape HTML first
    let html = escapeHtml(text);

    // Code blocks
    html = html.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
      `<pre><code>${code.trim()}</code></pre>`
    );

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    // Italic
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

    // Links [text](url)
    html = html.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,
      (_, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`
    );

    // Headers (## and ###)
    html = html.replace(/^### (.+)$/gm, '<strong>$1</strong>');
    html = html.replace(/^## (.+)$/gm, '<strong>$1</strong>');

    // Bullet lists
    html = html.replace(/^[•\-\*] (.+)$/gm, '• $1');

    // Double newline → paragraph break
    html = html.replace(/\n\n/g, '<br><br>');
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Focus input on load
  inputEl.focus();
})();
</script>
</body>
</html>
